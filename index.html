<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache">
    <meta name="theme-color" content="#04040a">
    <title>JS RNG</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Orbit&display=swap" rel="stylesheet">
    <!-- 업데이트할 때: 아래 ?v= 숫자 3곳과 version.json 숫자를 똑같이 올리기 -->
    <link rel="stylesheet" href="style.css?v=6">
    <link rel="stylesheet" href="effects.css?v=6">
    <script type="importmap">{ "imports": { "three": "./lib/three.module.js" } }</script>
</head>
<body>

    <!-- 🧊 3D 무대 (별, 바닥, 캐릭터, 아우라) — 안 되면 2D 별 배경으로 대신함 -->
    <canvas id="stage3d" aria-hidden="true"></canvas>
    <canvas id="starfield" class="hidden" aria-hidden="true"></canvas>
    <div id="ambient" aria-hidden="true"></div>
    <div id="nametag" class="hidden"></div>

    <!-- 🌌 컷씬 (DIVINE / COSMIC / JS) -->
    <div id="star-cutscene-overlay" class="hidden">
        <button id="skip-cutscene-btn">SKIP</button>
        <div id="cutscene-star-container">
            <div class="star-beam vertical"></div>
            <div class="star-beam horizontal"></div>
        </div>
        <div id="glitch-text-container"></div>
    </div>
    <div id="border-glow-overlay" class="overlay hidden"></div>

    <!-- 🏠 로비 -->
    <div id="lobby-screen">
        <div class="lobby-inner">
            <div class="logo">JS RNG</div>
            <div class="lobby-sub">운명은 한 번의 롤로 바뀐다</div>
            <button id="game-start-btn" class="start-btn">시작</button>
            <div id="lobby-save-info" class="lobby-save"></div>
        </div>
    </div>

    <!-- 🎮 메인 -->
    <div id="main-game" class="hidden">
        <header class="topbar">
            <div class="readout">
                <div class="readout-item"><span class="readout-label">ROLLS</span><span id="roll-count" class="readout-val">0</span></div>
                <div class="readout-item"><span class="readout-label">JC</span><span id="jc-count" class="readout-val gold">0</span></div>
            </div>
            <div class="topbar-right">
                <button id="main-dev-btn" class="icon-btn hidden" aria-label="개발자 콘솔">
                    <svg viewBox="0 0 24 24"><path d="M8 9l-4 3 4 3M16 9l4 3-4 3M13.5 6l-3 12"/></svg>
                </button>
                <button id="settings-btn" class="icon-btn" aria-label="설정">
                    <svg viewBox="0 0 24 24"><path d="M9 9h6v6H9z"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
                </button>
            </div>
        </header>

        <!-- 3D 캐릭터가 이 영역 가운데에 서 있음. 안의 글자는 전부 겹쳐 띄워서 크기가 변해도 아래 버튼이 안 움직임 -->
        <section class="stage">
            <div id="aura-display">
                <div class="stage-hint">ROLL을 눌러 운명을 확인하세요</div>
            </div>
            <div class="stats">
                <div class="stat"><span class="stat-label">LUCK</span><span class="stat-val">×<b id="luck-multiplier">1</b></span></div>
                <div class="stat-sep"></div>
                <div class="stat"><span class="stat-label">SPEED</span><span class="stat-val">×<b id="speed-multiplier">1.00</b></span></div>
            </div>
        </section>
        <div id="active-buffs" class="buffs"></div>

        <section class="controls">
            <button id="roll-btn">
                <div class="roll-btn-content">
                    <span id="btn-main-text">ROLL</span>
                    <span id="btn-sub-text" class="hidden">0 / 10</span>
                </div>
                <div id="cooldown-bar"></div>
            </button>
            <div class="toggles">
                <button id="auto-roll-btn" class="toggle">AUTO</button>
                <button id="quick-roll-btn" class="toggle" disabled>QUICK</button>
            </div>
        </section>

        <nav class="bottom-nav">
            <button class="nav-btn" data-sheet="sheet-bag">
                <svg viewBox="0 0 24 24"><path d="M5 8h14l-1 12H6L5 8z"/><path d="M9 8V6a3 3 0 016 0v2"/></svg><span>가방</span>
            </button>
            <button class="nav-btn" data-sheet="sheet-craft">
                <svg viewBox="0 0 24 24"><path d="M12 3l2.2 5.8L20 11l-5.8 2.2L12 19l-2.2-5.8L4 11l5.8-2.2z"/></svg><span>제작</span>
            </button>
            <button class="nav-btn" data-sheet="sheet-shop">
                <svg viewBox="0 0 24 24"><path d="M10 3h4M10.5 3v6L5.5 18a2 2 0 001.8 3h9.4a2 2 0 001.8-3l-5-9V3"/><path d="M7.5 15h9"/></svg><span>상점</span>
            </button>
            <button class="nav-btn" data-sheet="sheet-quest">
                <svg viewBox="0 0 24 24"><path d="M6 4h12v16H6z"/><path d="M9 9h6M9 13h6M9 17h3"/></svg><span>퀘스트</span>
            </button>
            <button class="nav-btn" data-sheet="sheet-index">
                <svg viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/><path d="M9 9h6v6H9z"/><path d="M12 4v5M12 15v5"/></svg><span>도감</span>
            </button>
        </nav>
    </div>

    <!-- 🎒 가방 -->
    <div id="sheet-bag" class="sheet-backdrop hidden">
        <div class="sheet">
            <div class="sheet-head"><h2>가방</h2><button class="sheet-close" data-close aria-label="닫기">✕</button></div>
            <div class="tabs" id="bag-tabs">
                <button class="tab active" data-tab="aura">칭호</button>
                <button class="tab" data-tab="potion">물약</button>
            </div>
            <div class="sheet-body">
                <div id="inventory-grid"></div>
                <div id="potion-grid" class="hidden"></div>
            </div>
        </div>
    </div>

    <!-- 🔨 제작 -->
    <div id="sheet-craft" class="sheet-backdrop hidden">
        <div class="sheet">
            <div class="sheet-head"><h2>제작</h2><button class="sheet-close" data-close aria-label="닫기">✕</button></div>
            <div class="tabs" id="craft-tabs">
                <button class="tab active" data-tab="gauntlet">건틀렛</button>
                <button class="tab" data-tab="amulet">부적</button>
            </div>
            <div class="sheet-body"><div id="craft-grid"></div></div>
        </div>
    </div>

    <!-- 🛒 상점 -->
    <div id="sheet-shop" class="sheet-backdrop hidden">
        <div class="sheet">
            <div class="sheet-head"><h2>상점</h2><button class="sheet-close" data-close aria-label="닫기">✕</button></div>
            <div class="sheet-body"><div id="shop-grid"></div></div>
        </div>
    </div>

    <!-- 📜 퀘스트 -->
    <div id="sheet-quest" class="sheet-backdrop hidden">
        <div class="sheet">
            <div class="sheet-head"><h2>퀘스트</h2><button class="sheet-close" data-close aria-label="닫기">✕</button></div>
            <div class="sheet-body"><div id="quest-list"></div></div>
        </div>
    </div>

    <!-- 📖 도감 -->
    <div id="sheet-index" class="sheet-backdrop hidden">
        <div class="sheet">
            <div class="sheet-head"><h2>도감 <small id="index-progress"></small></h2><button class="sheet-close" data-close aria-label="닫기">✕</button></div>
            <div class="sheet-body"><div id="index-grid"></div></div>
        </div>
    </div>

    <!-- ⚙️ 설정 -->
    <div id="sheet-settings" class="sheet-backdrop hidden">
        <div class="sheet">
            <div class="sheet-head"><h2>설정</h2><button class="sheet-close" data-close aria-label="닫기">✕</button></div>
            <div class="sheet-body">
                <div class="section">
                    <div class="section-title">사운드</div>
                    <button id="sound-toggle-btn" class="btn btn-block">사운드 켜짐</button>
                    <div class="slider-row"><label>마스터 <span id="vol-master-val">100</span></label><input type="range" id="vol-master" min="0" max="100"></div>
                    <div class="slider-row"><label>BGM <span id="vol-bgm-val">70</span></label><input type="range" id="vol-bgm" min="0" max="100"></div>
                    <div class="slider-row"><label>컷씬 · 등장음 <span id="vol-cutscene-val">50</span></label><input type="range" id="vol-cutscene" min="0" max="100"></div>
                    <div class="slider-row"><label>클릭음 <span id="vol-click-val">100</span></label><input type="range" id="vol-click" min="0" max="100"></div>
                    <div class="slider-row"><label>롤링음 <span id="vol-roll-val">100</span></label><input type="range" id="vol-roll" min="0" max="100"></div>
                </div>

                <div class="section">
                    <div class="section-title">자동 판매</div>
                    <div class="section-desc">켜 둔 등급은 뽑자마자 JC로 바뀝니다.</div>
                    <div id="auto-sell-grid"></div>
                </div>

                <div class="section">
                    <div class="section-title">쿠폰</div>
                    <div class="input-row">
                        <input type="text" id="code-input" placeholder="코드 입력" autocomplete="off">
                        <button id="submit-code-btn" class="btn btn-primary">입력</button>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">등급별 확률</div>
                    <div id="grade-table"></div>
                </div>

                <button id="dev-btn" class="dev-link">개발자 모드</button>
            </div>
        </div>
    </div>

    <!-- 🛠️ 개발자 -->
    <div id="sheet-dev" class="sheet-backdrop hidden">
        <div class="sheet">
            <div class="sheet-head"><h2>개발자 콘솔</h2><button class="sheet-close" data-close aria-label="닫기">✕</button></div>
            <div class="sheet-body">
                <div class="dev-list">
                    <button class="btn btn-block" data-dev="jc">+100만 JC</button>
                    <button class="btn btn-block" data-dev="luck">기본 행운 10,000배</button>
                    <button class="btn btn-block" data-dev="auras">모든 칭호 50개씩</button>
                    <button class="btn btn-block" data-dev="quests">모든 퀘스트 조건 달성</button>
                    <button class="btn btn-block" data-dev="crafts">모든 제작템 획득</button>
                </div>
                <div class="section">
                    <div class="section-title">다음 롤 칭호 지정</div>
                    <select id="dev-aura-select"></select>
                    <button class="btn btn-block" data-dev="next">지정</button>
                </div>
                <button class="btn btn-block btn-red" data-dev="exit">개발자 모드 종료 (원래 데이터로 복구)</button>
            </div>
        </div>
    </div>

    <!-- 🔢 수량 선택 -->
    <div id="qty-dialog" class="dialog-backdrop hidden">
        <div class="dialog">
            <div id="qty-title" class="dialog-title"></div>
            <div id="qty-sub" class="dialog-sub"></div>
            <input type="range" id="qty-slider" min="1" max="1" value="1">
            <div class="qty-row">
                <button class="qty-step" data-step="-1" aria-label="하나 빼기">−</button>
                <input type="number" id="qty-input" min="1" value="1" inputmode="numeric">
                <button class="qty-step" data-step="1" aria-label="하나 더하기">+</button>
                <button class="qty-max" data-step="max">MAX</button>
            </div>
            <div id="qty-total" class="qty-total"></div>
            <div class="dialog-actions">
                <button class="btn" data-qty="cancel">취소</button>
                <button id="qty-confirm" class="btn btn-primary" data-qty="ok">확인</button>
            </div>
        </div>
    </div>

    <!-- ❓ 확인 / 입력 -->
    <div id="ask-dialog" class="dialog-backdrop hidden">
        <div class="dialog">
            <div id="ask-title" class="dialog-title"></div>
            <div id="ask-msg" class="dialog-sub"></div>
            <input type="password" id="ask-input" class="hidden" autocomplete="off" inputmode="numeric">
            <div class="dialog-actions">
                <button class="btn" data-ask="cancel">취소</button>
                <button id="ask-ok" class="btn btn-primary" data-ask="ok">확인</button>
            </div>
        </div>
    </div>

    <div id="toast-wrap"></div>

    <script type="module" src="script.js?v=6"></script>
</body>
</html>
